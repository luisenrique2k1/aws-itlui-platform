name: CloudFormation Change Set

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  prepare-change-set:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CloudFormation template
        run: |
          python -m pip install cfn-lint
          cfn-lint cloudformation/templates/s3-lab.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::273422285435:role/itlui-cloudformation-github-role
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check CloudFormation stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name itlui-cfn-s3-lab \
            --region eu-north-1 \
            --query 'Stacks[0].{Status:StackStatus,Role:RoleARN}' \
            --output json